[package]
name = "agent-client"
version = "0.39.0"
edition = "2021"
repository = "https://github.com/Julian-adv/OpenMMO"

[dependencies]
onlinerpg-shared = { path = "../shared" }
onlinerpg-terrain = { path = "../terrain" }
tokio = { version = "1.0", features = ["full"] }
# rustls feature: without it `wss://` fails outright, and a remote
# agent-client can only reach the server through the TLS front door.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
axum = "0.8"

[dev-dependencies]
# test-util: paused clock in tests.
tokio = { version = "1.0", features = ["test-util"] }

[build-dependencies]
serde_json = "1.0"

[target."cfg(unix)".dependencies]
flate2 = "1.1.9"
libc = "0.2"
tar = "0.4.46"

[target."cfg(windows)".dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
