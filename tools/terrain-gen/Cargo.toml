[package]
name = "terrain-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terrain-gen"
path = "src/main.rs"

[dependencies]
onlinerpg-shared = { path = "../../shared" }
onlinerpg-terrain = { path = "../../terrain" }
image = { version = "0.25", default-features = false, features = ["png"] }
webp = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
rayon = "1"
